<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var ten, tuoi; //khai báo 2 biến để lưu tên và tuổi
      ten = prompt("Ban hay nhap vao ten: ", "");
      tuoi = prompt("Ban hay nhap vao tuoi: ", 20);
      document.write("Chao ban :<B>" + ten + "</B>");
      document.write("<br>"); // xuống dòng
      document.write("Tuoi cua ban la : <U> " + tuoi + "</U>");
    </script>
  </body>
</html>
