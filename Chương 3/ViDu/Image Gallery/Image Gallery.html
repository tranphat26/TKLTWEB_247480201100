<!DOCTYPE html>
<html>
<head>
<style>
div.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
}

div.gallery-item {
  margin: 5px;
  border: 1px solid #ccc;
  width: 180px;
}

div.gallery-item:hover {
  border: 1px solid #777;
}

div.gallery-item img {
  width: 100%;
  height: auto;
}

div.gallery-item div.desc {
  padding: 15px;
  text-align: center;
}
</style>
</head>
<body>

<h2>Thiết bị máy tính</h2>

<div class="gallery">

<div class="gallery-item">
  <a target="_blank" href="img_5terre.jpg">
    <img src="banphim.jpg" alt="Bàn Phím" width="600" height="400">
  </a>
  <div class="desc">Bàn Phím</div>
</div>

<div class="gallery-item">
  <a target="_blank" href="img_forest.jpg">
    <img src="manhinh.jpg" alt="manhinh" width="600" height="400">
  </a>
  <div class="desc">Màn Hình</div>
</div>

<div class="gallery-item">
  <a target="_blank" href="img_lights.jpg">
    <img src="chuot.jpg" alt="chuot" width="600" height="400">
  </a>
  <div class="desc">Con chuột</div>
</div>

<div class="gallery-item">
  <a target="_blank" href="img_mountains.jpg">
    <img src="bopc.jpg" alt="Mountains" width="600" height="400">
  </a>
  <div class="desc">PC</div>
</div>

</div>

</body>
</html>
